# Seller admin (UAT, branch uat) on the AWS server: uat-admin.oyklane.com.
# HTTPS comes from the shared proxy (~/apps/proxy), which reaches it as
# "oyklane-admin-uat" on the "web" network.
# Run from the repo root:  docker compose -f deploy/docker-compose.uat.yml up -d --build
name: oyklane-admin-uat
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://uat-api.oyklane.com
        NEXT_PUBLIC_STOREFRONT_ROOT_DOMAIN: oyklane.com
    restart: unless-stopped
    networks:
      web: { aliases: [oyklane-admin-uat] }
networks:
  web: { external: true }
